<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square App Icon -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="#FF5722" stroke-width="14"/>
  
  <!-- Lightning Bolt / Gaming Cafe Emblem -->
  <path d="M280 64 L140 280 L250 280 L232 448 L372 232 L262 232 Z" 
        fill="url(#accent)" 
        stroke="#FFFFFF" 
        stroke-width="12" 
        stroke-linejoin="round" 
        stroke-linecap="round"/>
        
  <!-- Small Coffee Cup Motif Accent -->
  <circle cx="390" cy="120" r="32" fill="#F59E0B" stroke="#000000" stroke-width="6"/>
  <text x="390" y="132" font-size="34" text-anchor="middle" font-family="sans-serif">☕</text>
</svg>
